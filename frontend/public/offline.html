<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChainVerify Offline</title>
    <style>
      body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:Inter,system-ui,sans-serif; background:#0f172a; color:#f8fafc; }
      .card { max-width:580px; width:100%; padding:32px; border-radius:24px; background:rgba(15,23,42,0.9); border:1px solid rgba(255,255,255,0.08); box-shadow:0 24px 80px rgba(15,23,42,0.35); }
      h1 { margin:0 0 16px; font-size:2rem; line-height:1.1; }
      p { margin:0 0 1.5rem; color:#cbd5e1; }
      a { display:inline-flex; align-items:center; justify-content:center; padding:0.9rem 1.4rem; border-radius:999px; background:#0369a1; color:#fff; text-decoration:none; font-weight:700; transition:transform .2s ease; }
      a:hover { transform:translateY(-1px); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ChainVerify is Offline</h1>
      <p>You are currently offline. The app will resume normal operation once network connectivity is restored, and the latest verified records will be available again.</p>
      <a href="/">Return to ChainVerify</a>
    </div>
  </body>
</html>
